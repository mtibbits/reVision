name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      RV_REQUIRE_GOLDEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: python -m pip install -e ".[dev]" -c ci-constraints-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -vv --browser chromium
  browsers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: python -m pip install -e ".[dev]" -c ci-constraints-requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python -m playwright --version
      - run: python -m pytest -vv -rxXfE tests/browser --browser ${{ matrix.browser }}
